<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Studio</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#262624">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#262624;--side:#1f1e1d;--card:#30302e;--card2:#3a3936;--line:#3e3d39;--ink:#f5f4ef;--dim:#b7b5a9;--faint:#8a887f;
  --accent:#d97757;--accent-ink:#1d0f09;--ok:#7ccf8a;--bad:#f28b82;--warn:#e9c46a;--blue:#8ab4f8;
  --add:rgba(124,207,138,.13);--del:rgba(242,139,130,.13);
  --sub:#d97757;--free:#7ccf8a;--api:#8ab4f8;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,Cambria,serif;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --fs:15px;
}
:root[data-theme="light"]{
  --bg:#faf9f5;--side:#f0eee6;--card:#ffffff;--card2:#f0eee6;--line:#e3e0d5;--ink:#29261b;--dim:#5e5b51;--faint:#8c897f;
  --accent:#c6613f;--accent-ink:#fff;--ok:#2f7d3e;--bad:#b3261e;--blue:#2a5bd7;--add:rgba(47,125,62,.1);--del:rgba(179,38,30,.09);
  --sub:#c6613f;--free:#2f7d3e;--api:#2a5bd7;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#faf9f5;--side:#f0eee6;--card:#ffffff;--card2:#f0eee6;--line:#e3e0d5;--ink:#29261b;--dim:#5e5b51;--faint:#8c897f;
    --accent:#c6613f;--accent-ink:#fff;--ok:#2f7d3e;--bad:#b3261e;--blue:#2a5bd7;--add:rgba(47,125,62,.1);--del:rgba(179,38,30,.09);
    --sub:#c6613f;--free:#2f7d3e;--api:#2a5bd7;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:var(--fs)/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.app{display:flex;height:100dvh;overflow:hidden}
.ib{background:none;border:0;color:var(--dim);padding:6px 8px;border-radius:8px;line-height:1;display:inline-flex;align-items:center;gap:6px}
.ib:hover{background:var(--card2);color:var(--ink)}
.kbd{font:11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* ─────────── sidebar ─────────── */
.side{width:272px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin .18s}
.app.noside .side{margin-left:-272px}
.side .top{display:flex;align-items:center;gap:6px;padding:10px 10px 6px}
.brand{display:flex;align-items:center;gap:8px;font:600 18px var(--serif);flex:1}
.brand img{width:22px;height:22px;border-radius:6px}
.newchat{margin:4px 10px 8px;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--ink);font-weight:600}
.newchat:hover{background:var(--card2)}
.newchat .plus{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px}
.navb{margin:0 10px;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:6px 10px;color:var(--dim);font-size:14px;width:calc(100% - 20px);text-align:left}
.navb:hover{background:var(--card2);color:var(--ink)}
.navb .sp{flex:1}
.list{flex:1;overflow:auto;padding:6px 6px 12px;min-height:0}
.grp{font-size:12px;color:var(--faint);padding:12px 10px 4px;display:flex;align-items:center;gap:6px}
.grp select{background:none;border:0;color:var(--faint);font-size:12px;margin-left:auto}
.it{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:14px;min-width:0;position:relative}
.it:hover{background:var(--card2);color:var(--ink)}
.it.on{background:var(--card);color:var(--ink)}
.it .ic{flex:none;width:16px;text-align:center;font-size:12px;opacity:.85}
.it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .busy{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.side .foot{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.syncpill{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center;padding:2px 10px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left}
.syncpill:hover{color:var(--ink)}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;border:0;background:none;width:100%;text-align:left}
.me:hover{background:var(--card2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--ink);flex:none;border:1px solid var(--line)}
.me .n{font-weight:600;font-size:14px;line-height:1.2}.me .s{font-size:12px;color:var(--faint)}
.scrim{display:none}

/* ─────────── utama ─────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:52px}
.head .title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;border:0;background:none;padding:4px 8px;border-radius:8px;color:var(--ink);max-width:46vw}
.head .title:hover{background:var(--card2)}
.head .sp{flex:1}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:8px;color:var(--dim);font-size:13.5px;font-weight:500}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.body{flex:1;display:flex;min-height:0}
.convo{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.msgs{flex:1;overflow:auto;scroll-behavior:auto}
.col{max-width:780px;margin:0 auto;padding:8px 20px 24px}
.banner{max-width:780px;margin:0 auto 8px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--dim);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .sp{flex:1}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:6px 14px;font-weight:600}
.btn2{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:5px 12px;color:var(--ink)}
.btn:disabled,.btn2:disabled{opacity:.45;cursor:default}

.msg{margin:22px 0;position:relative}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--card2);border-radius:18px;padding:10px 16px;max-width:100%;white-space:pre-wrap;word-wrap:break-word}
.att-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;justify-content:flex-end}
.chipf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 10px;font-size:12.5px;color:var(--dim);text-decoration:none;max-width:240px}
.chipf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.msg .acts{display:flex;flex-wrap:wrap;align-items:center;gap:2px;opacity:0;transition:opacity .15s;margin-top:4px}
.msg:hover .acts,.msg:focus-within .acts{opacity:1}
.msg.user .acts{position:absolute;right:0;bottom:-28px}
.acts button{background:none;border:0;color:var(--faint);padding:3px 7px;border-radius:6px;font-size:12.5px}
.acts button:hover{background:var(--card2);color:var(--ink)}
.acts .meta{font-size:12px;color:var(--faint);padding:3px 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;border-radius:999px;padding:0 8px;border:1px solid var(--line);white-space:nowrap}
.g-langganan{color:var(--sub);border-color:color-mix(in srgb,var(--sub) 45%,transparent)}
.g-gratis{color:var(--free);border-color:color-mix(in srgb,var(--free) 45%,transparent)}
.g-api{color:var(--api);border-color:color-mix(in srgb,var(--api) 45%,transparent)}
.ai .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint);margin-bottom:4px}
.spark{width:22px;height:22px;flex:none;color:var(--accent)}
.spark.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err .md{color:var(--bad)}

.think{border-left:2px solid var(--line);margin:4px 0 10px;padding:0 0 0 12px;color:var(--faint);font-size:14px}
.think summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;color:var(--dim)}
.think summary::-webkit-details-marker{display:none}
.think summary::after{content:"›";transform:rotate(90deg);transition:transform .15s}
.think:not([open]) summary::after{transform:none}
.think .tx{white-space:pre-wrap;max-height:320px;overflow:auto;margin-top:4px}

.steps{margin:4px 0 10px;display:flex;flex-direction:column;gap:2px}
.step{font:13px/1.5 var(--mono)}
.step>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;color:var(--dim);padding:2px 0;min-width:0}
.step>summary::-webkit-details-marker{display:none}
.step>summary .b{flex:none;color:var(--ok)}
.step.run>summary .b{color:var(--warn);animation:pulse 1s infinite}
.step.bad>summary .b{color:var(--bad)}
.step>summary .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.step>summary .l b{color:var(--ink);font-weight:600}
.step .out{margin:2px 0 6px 18px;border-left:1px solid var(--line);padding-left:10px;color:var(--faint);white-space:pre-wrap;max-height:300px;overflow:auto;font-size:12.5px}
.diff{margin:4px 0 8px 18px;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:380px;font:12.5px/1.5 var(--mono)}
.diff div{white-space:pre;padding:0 10px}
.diff .d{background:var(--del);color:var(--bad)}.diff .a{background:var(--add);color:var(--ok)}.diff .h{color:var(--faint);background:var(--card);padding:3px 10px}
.todo{margin:2px 0 6px 18px;font-size:13px}
.perm{border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0}
.perm .q{font-weight:600;margin-bottom:6px;font-family:system-ui}
.perm .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.perm.done{opacity:.7;padding:6px 12px;font-size:13px}

.md{word-wrap:break-word}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.55em 0}.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .4em;line-height:1.3;font-weight:600}.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.06em}
.md ul,.md ol{margin:.4em 0;padding-left:1.5em}.md li{margin:.15em 0}
.md code{font:.88em var(--mono);background:var(--card2);padding:.1em .4em;border-radius:5px}
.md pre{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;margin:.7em 0}
.md pre .bar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px 14px;font:12px var(--mono);color:var(--faint);border-bottom:1px solid var(--line)}
.md pre .bar button{background:none;border:0;color:var(--faint);font-size:12px;border-radius:5px;padding:2px 6px}
.md pre .bar button:hover{background:var(--card2);color:var(--ink)}
.md pre code{display:block;background:none;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.55}
.md table{border-collapse:collapse;display:block;overflow:auto;margin:.7em 0;font-size:.94em}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}.md th{background:var(--card)}
.md blockquote{margin:.6em 0;padding:.1em 0 .1em 14px;border-left:3px solid var(--line);color:var(--dim)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md .tok-k{color:#c792ea}.md .tok-s{color:#c3e88d}.md .tok-c{color:var(--faint);font-style:italic}.md .tok-n{color:#f78c6c}
:root[data-theme="light"] .md .tok-k{color:#8b2bb9}:root[data-theme="light"] .md .tok-s{color:#2e7d32}:root[data-theme="light"] .md .tok-n{color:#c2410c}
.caret::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:4px;animation:pulse 1s infinite;vertical-align:middle}

/* sambutan */
.hello{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 16px 8vh;overflow:auto}
.hello h1{font:400 clamp(28px,4.4vw,40px)/1.2 var(--serif);margin:0 0 22px;display:flex;align-items:center;gap:12px;text-align:center}
.hello h1 svg{width:34px;height:34px;color:var(--accent);flex:none}
.hello .composer{width:100%;max-width:700px;padding:0}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;max-width:700px}
.quick button{border:1px solid var(--line);background:none;border-radius:10px;padding:6px 12px;color:var(--dim);font-size:13.5px}
.quick button:hover{background:var(--card2);color:var(--ink)}
.srcnote{margin-top:16px;font-size:12.5px;color:var(--faint);text-align:center;max-width:620px}

/* composer */
.composer{padding:0 16px 14px;flex:none}
.cbox{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px 8px;box-shadow:0 2px 14px rgba(0,0,0,.12);transition:border-color .15s}
.cbox:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.cbox.drag{border-color:var(--accent);border-style:dashed}
.cbox textarea{width:100%;border:0;outline:none;resize:none;background:none;min-height:26px;max-height:42vh;padding:2px 4px;font-size:var(--fs);line-height:1.55;display:block}
.cbar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:nowrap;min-width:0}
.cbar .cb.plain{min-width:0;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.ebar .ib{white-space:nowrap}
.cbar .sp{flex:1}
.cb{border:1px solid var(--line);background:none;border-radius:10px;height:32px;min-width:32px;padding:0 10px;color:var(--dim);display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.cb:hover{background:var(--card2);color:var(--ink)}
.cb.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cb.plain{border-color:transparent}
.send{width:34px;height:34px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px;font-weight:700}
.send:disabled{opacity:.35;cursor:default}
.send.stop{background:var(--ink);color:var(--bg)}
.pend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pend .pf{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 26px 6px 8px;font-size:12.5px;background:var(--bg);max-width:230px}
.pend .pf img{width:36px;height:36px;object-fit:cover;border-radius:8px}
.pend .pf .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend .pf .sz{color:var(--faint);font-size:11px}
.pend .pf .x{position:absolute;top:2px;right:2px;border:0;background:none;color:var(--faint);border-radius:6px;padding:0 5px}
.pend .pf.up{opacity:.6}
.hint{max-width:780px;margin:6px auto 0;text-align:center;font-size:11.5px;color:var(--faint)}

/* popover & modal */
.pop{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:6px;min-width:240px;max-width:min(380px,calc(100vw - 16px));max-height:min(70vh,560px);overflow:auto}
.pop .ttl{font-size:11.5px;color:var(--faint);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.pop .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:7px 10px;color:var(--ink);font-size:14px}
.pop .opt:hover,.pop .opt.kb{background:var(--card2)}
.pop .opt .d{font-size:12px;color:var(--faint)}
.pop .opt .ck{margin-left:auto;color:var(--accent)}
.pop .opt.dis{color:var(--faint)}
.pop input.f{width:calc(100% - 8px);margin:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px 12px}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:min(860px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .mh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.modal .mh h2{margin:0;font:500 20px var(--serif);flex:1}
.modal .mb{display:flex;min-height:0;flex:1}
.tabsv{width:190px;border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;flex:none}
.tabsv button{text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;color:var(--dim)}
.tabsv button.on{background:var(--card2);color:var(--ink)}
.pane{flex:1;overflow:auto;padding:16px 18px 24px}
.pane h3{margin:0 0 4px;font-size:16px}
.pane p.s{margin:0 0 14px;color:var(--faint);font-size:13.5px}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--accent)}
.radios{display:grid;gap:8px;margin:10px 0}
.radios label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card)}
.radios label.on{border-color:var(--accent)}
.radios b{display:block}.radios small{color:var(--faint)}
.pcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.pcard .h{display:flex;align-items:center;gap:8px;font-weight:600}
.pcard .n{font-size:12.5px;color:var(--faint);margin:2px 0 4px}
.pcard .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard .fld{margin:4px 0}.pcard .fld input{padding:6px 8px;font:13px var(--mono)}
.pcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pcard .msgx{font-size:12.5px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.skl{display:flex;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;align-items:flex-start}
.skl:hover{background:var(--card)}
.skl input{margin-top:4px;accent-color:var(--accent)}
.skl small{display:block;color:var(--faint)}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--ink)}
.res:hover,.res.kb{background:var(--card2)}
.res small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:60;max-width:90vw;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3)}

/* workspace (mode Code) */
.ws{width:min(48%,760px);border-left:1px solid var(--line);display:none;flex-direction:column;min-width:0;background:var(--side)}
.app.mcode.wsopen .ws{display:flex}
.wsh{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
.wsh .t{font-size:13px;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsb{flex:1;display:flex;min-height:0}
.tree{width:220px;overflow:auto;border-right:1px solid var(--line);padding:4px;flex:none;font-size:13px}
.tree .tn{display:flex;align-items:center;gap:6px;padding:2px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--dim)}
.tree .tn:hover{background:var(--card2);color:var(--ink)}
.tree .tn.on{background:var(--card);color:var(--ink)}
.ed{flex:1;display:flex;flex-direction:column;min-width:0}
.etabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.etab{display:flex;align-items:center;gap:4px;padding:5px 6px 5px 10px;font-size:12.5px;color:var(--dim);border-right:1px solid var(--line);white-space:nowrap;cursor:pointer}
.etab.on{background:var(--bg);color:var(--ink)}
.etab .x{border:0;background:none;color:var(--faint);border-radius:4px;padding:0 4px}
.etab .m{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ebar{display:flex;gap:6px;align-items:center;padding:4px 8px;font-size:12px;color:var(--faint);border-bottom:1px solid var(--line)}
.ebar .sp{flex:1}
.code{flex:1;display:flex;min-height:0;font:12.5px/19px var(--mono);background:var(--bg)}
.gut{padding:8px 8px 8px 10px;text-align:right;color:var(--faint);user-select:none;overflow:hidden;white-space:pre;min-width:42px}
.code textarea{flex:1;border:0;outline:none;resize:none;background:none;padding:8px 10px;white-space:pre;overflow:auto;tab-size:2;font:inherit;color:var(--ink)}
.edempty{flex:1;display:grid;place-items:center;color:var(--faint);font-size:13px;padding:20px;text-align:center}

/* ponsel */

<input type="file" id="fileIn" multiple hidden>

<script>
"use strict";
/* ═════════════ dasar ═════════════ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const LS = {
  get(k, d) { try { const v = localStorage.getItem("studio2." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("studio2." + k, JSON.stringify(v)); } catch {} },
};
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "content-type": "application/json", ...(opts.headers || {}) }, body: opts.body && typeof opts.body !== "string" && !(opts.body instanceof Blob) ? JSON.stringify(opts.body) : opts.body });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = "/login"; throw new Error("Belum masuk."); }
  if (!r.ok) throw Object.assign(new Error(j.error || `HTTP ${r.status}`), { status: r.status, data: j });
  return j;
}
function toast(t, ms = 3000) {
  $$(".toast").forEach((x) => x.remove());
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = t; document.body.append(d);
  setTimeout(() => d.remove(), ms);
}
const isMobile = () => innerWidth <= 860;
const SPARK = `<svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" opacity=".7"/></svg>`;
const SRC = { studio: { ic: "", name: "Studio" }, claude: { ic: "◆", name: "Claude Code" }, kantor: { ic: "🏢", name: "Kantor PGA" }, hvm: { ic: "💬", name: "HvM AI" } };
const GROUP = { langganan: "Langganan Claude", gratis: "Gratis", api: "API berbayar" };
const MODEL_NAME = { "claude-sonnet-5-5": "Sonnet 5.5", "claude-opus-5-5": "Opus 5.5", "claude-haiku-5-5": "Haiku 5.5", "claude-fable-5-1": "Fable 5.1", auto: "Otomatis", "auto:smart": "Paling pintar", "auto:fast": "Paling cepat", "auto:reliable": "Paling andal", "auto:balanced": "Seimbang", fusion: "Fusion (gabungan)" };
const MODEL_DESC = { "claude-sonnet-5-5": "Cerdas & efisien untuk sehari-hari", "claude-opus-5-5": "Paling mampu, untuk tugas sulit", "claude-haiku-5-5": "Tercepat & paling hemat", "claude-fable-5-1": "Model terbaru", auto: "FreeLLMAPI memilih penyedia", fusion: "Beberapa model digabung (lambat)" };
const PERM = { baca: { ic: "👁", n: "Baca saja", d: "Hanya membaca berkas, tidak mengubah apa pun" }, tanya: { ic: "🛡", n: "Tanya dulu", d: "Minta izin sebelum mengubah berkas atau menjalankan perintah" }, otomatis: { ic: "⚡", n: "Otomatis", d: "Langsung mengubah berkas & menjalankan perintah" } };

const S = {
  info: null, providers: [], skills: [], sessions: [], sync: null, profile: { name: "Rahula" },
  cur: null, live: null, // live = { sid, msg, ac }
  provider: LS.get("provider", "langganan"), model: LS.get("model", ""), models: {},
  mode: LS.get("mode", "chat"), perm: LS.get("perm", "tanya"), think: LS.get("think", false),
  skillsOn: new Set(LS.get("skills", [])), pending: [], wsFiles: [], srcFilter: LS.get("src", "all"),
  tabs: [], active: null, tree: {}, open: new Set(LS.get("openDirs", [""])), busyIds: new Set(),
  project: null, projects: [], account: null,
};

/* ═════════════ markdown + sorot kode ═════════════ */
const KW = /\b(const|let|var|function|return|if|else|for|while|import|from|export|default|class|new|await|async|try|catch|throw|def|self|None|True|False|true|false|null|undefined|in|of|elif|lambda|with|as|pass|break|continue|switch|case|public|private|static|void|int|string|echo|fi|then|do|done|select|where|insert|update|delete|create|table)\b/g;
function hl(code, lang) {
  if (!/^(js|javascript|ts|typescript|jsx|tsx|py|python|sh|bash|shell|json|java|c|cpp|go|rust|php|sql|mjs|html|css)$/i.test(lang || "")) return esc(code);
  const toks = [];
  const keep = (cls) => (m) => { toks.push(`<span class="tok-${cls}">${esc(m)}</span>`); return `\u0001${toks.length - 1}\u0001`; };
  let s = code
    .replace(/(\/\/[^\n]*|#(?![!{])[^\n]*|\/\*[\s\S]*?\*\/|--[^\n]*(?=\n|$))/g, (m) => (/^--/.test(m) && !/sql/i.test(lang) ? m : keep("c")(m)))
    .replace(/("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, keep("s"));
  s = esc(s).replace(KW, '<span class="tok-k">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-n">$1</span>');
  return s.replace(/\u0001(\d+)\u0001/g, (_, i) => toks[+i]);
}
function md(src) {
  const blocks = [];
  src = String(src || "").replace(/```([\w+#.-]*)[^\n]*\n([\s\S]*?)(?:```|$)/g, (_, lang, code) => {
    blocks.push(`<pre><div class="bar"><span>${esc(lang || "teks")}</span><button data-copy>Salin</button></div><code>${hl(code.replace(/\n$/, ""), lang)}</code></pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  const inline = (t) => {
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(`<code>${esc(c)}</code>`); return `\u0002${codes.length - 1}\u0002`; });
    return esc(t)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>")
      .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?:;]|$)/g, "$1<i>$2</i>")
      .replace(/~~([^~]+)~~/g, "<s>$1</s>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<.,;:)])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(/\u0002(\d+)\u0002/g, (_, i) => codes[+i]);
  };
  let out = "", list = [], para = [], table = [];
  const flushP = () => { if (para.length) { out += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const closeLists = (to = 0) => { while (list.length > to) out += `</${list.pop().t}>`; };
  const flushT = () => {
    if (!table.length) return;
    const rows = table.filter((r) => !/^\|?\s*:?-{2,}/.test(r)).map((r) => r.replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim())));
    out += "<table>" + rows.map((r, i) => `<tr>${r.map((c) => (i ? `<td>${c}</td>` : `<th>${c}</th>`)).join("")}</tr>`).join("") + "</table>";
    table = [];
  };
  for (const l of src.split("\n")) {
    const blk = l.match(/^\s*\u0000(\d+)\u0000\s*$/);
    if (blk) { flushP(); closeLists(); flushT(); out += blocks[+blk[1]]; continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) { flushP(); closeLists(); table.push(l.trim()); continue; } else flushT();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flushP(); closeLists(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)/))) {
      flushP();
      const depth = Math.floor(m[1].replace(/\t/g, "  ").length / 2), t = /\d/.test(m[2]) ? "ol" : "ul";
      while (list.length > depth + 1) out += `</${list.pop().t}>`;
      if (list.length === depth + 1 && list.at(-1).t !== t) out += `</${list.pop().t}>`;
      if (list.length < depth + 1) { out += `<${t}>`; list.push({ t }); }
      out += `<li>${inline(m[3].replace(/^\[ \]\s/, "☐ ").replace(/^\[x\]\s/i, "☑ "))}</li>`;
    }
    else if ((m = l.match(/^>\s?(.*)/))) { flushP(); closeLists(); out += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { flushP(); closeLists(); out += "<hr>"; }
    else if (!l.trim()) { flushP(); closeLists(); }
    else { closeLists(); para.push(l); }
  }
  flushP(); closeLists(); flushT();
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  navigator.clipboard?.writeText(b.closest("pre").querySelector("code").textContent).then(() => { b.textContent = "Tersalin ✓"; setTimeout(() => (b.textContent = "Salin"), 1300); });
});

/* ═════════════ waktu ═════════════ */
function ago(t) {
  if (!t) return "";
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "baru saja";
  if (s < 3600) return `${Math.floor(s / 60)} mnt lalu`;
  if (s < 86400) return `${Math.floor(s / 3600)} jam lalu`;
  return new Date(t).toLocaleDateString("id-ID", { day: "numeric", month: "short" });
}
function dayGroup(t) {
  const diff = Math.floor((new Date(new Date().toDateString()) - new Date(new Date(t).toDateString())) / 86400000);
  return diff <= 0 ? "Hari ini" : diff === 1 ? "Kemarin" : diff < 7 ? "7 hari terakhir" : diff < 30 ? "30 hari terakhir" : new Date(t).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
}
function greet() {
  const h = new Date().getHours();
  return h < 11 ? "Selamat pagi" : h < 15 ? "Selamat siang" : h < 18 ? "Selamat sore" : "Selamat malam";
}
const kb = (n) => (n > 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);

/* ═════════════ sidebar: daftar sesi ═════════════ */
async function loadSessions() {
  try {
    const r = await api("/api/sessions");
    S.sessions = r.sessions; S.sync = r.sync;
  } catch (e) { return; }
  renderList(); renderSync();
}
function renderList() {
  const srcOf = (s) => (s.origin === "claude.ai" ? "claudeai" : s.source);
  const list = S.sessions.filter((s) => S.srcFilter === "all" || srcOf(s) === S.srcFilter || (S.srcFilter.startsWith("p:") && s.project === S.srcFilter.slice(2)));
  const counts = {};
  S.sessions.forEach((s) => (counts[srcOf(s)] = (counts[srcOf(s)] || 0) + 1));
  const pinned = list.filter((s) => s.pinned);
  let html = `<div class="grp">${pinned.length ? "Disematkan" : "Chat"}<select id="srcSel" title="Sumber">${[["all", "Semua sumber"], ["studio", "Studio"], ["claudeai", "claude.ai (impor)"], ["claude", "Claude Code"], ["kantor", "Kantor PGA"], ["hvm", "HvM AI"], ...S.projects.map((p) => ["p:" + p.id, "▤ " + p.name])].filter(([k]) => k === "all" || k.startsWith("p:") || counts[k] || k === S.srcFilter).map(([k, n]) => `<option value="${esc(k)}" ${S.srcFilter === k ? "selected" : ""}>${esc(n)}${k !== "all" && counts[k] ? ` (${counts[k]})` : ""}</option>`).join("")}</select></div>`;
  const item = (s) => {
    const on = S.cur && S.cur.source === s.source && S.cur.id === s.id;
    const ic = s.source === "studio" ? (s.origin === "claude.ai" ? "✳" : s.mode === "code" ? "‹›" : s.project ? "▤" : "") : SRC[s.source].ic;
    return `<div class="it ${on ? "on" : ""}" data-src="${s.source}" data-id="${esc(s.id)}" title="${esc(s.title)}${s.cwd ? "\n" + esc(s.cwd) : ""}"><span class="ic">${ic}</span><span class="t">${esc(s.title)}</span>${S.busyIds.has(s.id) ? '<span class="busy"></span>' : ""}</div>`;
  };
  html += pinned.map(item).join("");
  let last = pinned.length ? "" : "Chat";
  for (const s of list.filter((x) => !x.pinned)) {
    const g = dayGroup(s.updatedAt || 0);
    if (g !== last) { html += `<div class="grp">${g}</div>`; last = g; }
    html += item(s);
  }
  if (!list.length) html += `<div class="grp" style="justify-content:center;padding:24px">Belum ada chat.</div>`;
  $("#list").innerHTML = html;
  $("#srcSel").onchange = (e) => { S.srcFilter = e.target.value; LS.set("src", S.srcFilter); renderList(); };
  $$("#list .it").forEach((it) => (it.onclick = () => { openSession(it.dataset.src, it.dataset.id); if (isMobile()) sideMobile(false); }));
}
function renderSync() {
  const s = S.sync;
  if (!s) return;
  const pill = $("#syncPill");
  if (s.mode === "lokal") pill.innerHTML = `💾 Tersimpan lokal di server`;
  else if (s.error) pill.innerHTML = `<span style="color:var(--bad)">⚠️ Sinkron gagal</span> · klik untuk lihat`;
  else pill.innerHTML = `${s.busy ? "🔄" : "☁️"} ${s.mode === "github" ? "GitHub" : "Git"} · ${s.busy ? "menyinkronkan…" : s.last ? `tersinkron ${ago(s.last)}` : "menunggu"}`;
}

/* ═════════════ penyedia & model ═════════════ */
const prov = (id) => S.providers.find((p) => p.id === id);
const provShort = (id) => (prov(id)?.name || id).split(" (")[0];
const modelLabel = (m) => MODEL_NAME[m] || m;
function currentModel() { return S.model || prov(S.provider)?.defaultModel || ""; }
async function modelsOf(id) {
  if (S.models[id]) return S.models[id];
  const p = prov(id);
  S.models[id] = p?.models || [];
  if (p?.ready && p.kind === "openai") {
    const r = await api(`/api/providers/${id}/models`).catch(() => null);
    if (r?.models?.length) S.models[id] = r.models;
  }
  return S.models[id];
}
function setModel(provider, model) {
  S.provider = provider; S.model = model;
  LS.set("provider", provider); LS.set("model", model);
  renderComposerBar();
}

function popover(anchor, html, { align = "left", up = true } = {}) {
  closePop();
  const p = document.createElement("div");
  p.className = "pop"; p.innerHTML = html; p.id = "pop";
  document.body.append(p);
  const r = anchor.getBoundingClientRect();
  const w = p.offsetWidth, h = p.offsetHeight;
  let left = align === "right" ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  let top = up ? r.top - h - 6 : r.bottom + 6;
  if (top < 8) top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, innerHeight - h - 8);
  Object.assign(p.style, { left: left + "px", top: top + "px" });
  setTimeout(() => document.addEventListener("pointerdown", outside, true), 0);
  return p;
}
function outside(e) { const p = $("#pop"); if (p && !p.contains(e.target)) closePop(); }
function closePop() { $("#pop")?.remove(); document.removeEventListener("pointerdown", outside, true); }

async function openModelPicker(anchor) {
  const groups = ["langganan", "gratis", "api"];
  const ready = S.providers.filter((p) => p.ready);
  await Promise.all(ready.filter((p) => p.kind === "openai").map((p) => modelsOf(p.id)));
  const draw = (q = "") => {
    const ql = q.toLowerCase();
    let h = `<input class="f" id="mq" placeholder="Cari model…" value="${esc(q)}" autocomplete="off">`;
    for (const g of groups) {
      const ps = ready.filter((p) => p.group === g);
      let part = "";
      for (const p of ps) {
        const ms = (S.models[p.id] || p.models).filter((m) => !ql || (m + " " + modelLabel(m) + " " + p.name).toLowerCase().includes(ql)).slice(0, ql ? 60 : 12);
        if (!ms.length) continue;
        if (ps.length > 1 || g !== "langganan") part += `<div class="ttl" style="text-transform:none;letter-spacing:0;padding-top:4px">${esc(provShort(p.id))}</div>`;
        part += ms.map((m) => `<button class="opt" data-p="${p.id}" data-m="${esc(m)}"><span><div>${esc(modelLabel(m))}</div>${MODEL_DESC[m] || modelLabel(m) !== m ? `<div class="d">${esc(MODEL_DESC[m] || m)}</div>` : ""}</span>${S.provider === p.id && currentModel() === m ? '<span class="ck">✓</span>' : ""}</button>`).join("");
      }
      if (part) h += `<div class="ttl"><span class="badge g-${g}">${GROUP[g]}</span></div>${part}`;
    }
    const notReady = S.providers.filter((p) => !p.ready);
    h += `<hr><button class="opt" data-settings><span>⚙️ Tambah / atur penyedia</span><span class="d" style="margin-left:auto">${notReady.length} belum diatur</span></button>`;
    return h;
  };
  const p = popover(anchor, draw(), { align: "right" });
  const bind = () => {
    $$(".opt[data-p]", p).forEach((b) => (b.onclick = () => { setModel(b.dataset.p, b.dataset.m); closePop(); }));
    $(".opt[data-settings]", p).onclick = () => { closePop(); openSettings("model"); };
    const q = $("#mq", p);

/* ═════════════ lampiran ═════════════ */
async function uploadFiles(files) {
  for (const f of files) {
    if (f.size > 60 * 1024 * 1024) { toast(`${f.name} lebih dari 60 MB.`); continue; }
    const item = { name: f.name, size: f.size, type: f.type, uploading: true, preview: f.type.startsWith("image/") ? URL.createObjectURL(f) : null };
    S.pending.push(item); renderPending();
    try {
      const r = await api(`/api/upload?name=${encodeURIComponent(f.name)}`, { method: "POST", body: f, headers: { "content-type": f.type || "application/octet-stream" } });
      Object.assign(item, r.attachment, { uploading: false });
    } catch (e) { S.pending = S.pending.filter((x) => x !== item); toast(`Gagal mengunggah ${f.name}: ${e.message}`); }
    renderPending();
  }
}
function addWsFile(p) { if (p && !S.wsFiles.includes(p)) S.wsFiles.push(p); renderPending(); }
function renderPending() {
  const box = $("#pend");
  if (!box) return;
  const fileIc = (n) => (/\.pdf$/i.test(n) ? "📕" : /\.(xlsx?|csv)$/i.test(n) ? "📊" : /\.docx?$/i.test(n) ? "📘" : "📄");
  box.innerHTML =
    S.pending.map((a, i) => `<div class="pf ${a.uploading ? "up" : ""}">${a.preview ? `<img src="${a.preview}" alt="">` : `<span style="font-size:22px">${fileIc(a.name)}</span>`}<div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="sz">${a.uploading ? "mengunggah…" : kb(a.size)}</div></div><button class="x" data-rp="${i}">✕</button></div>`).join("") +
    S.wsFiles.map((f, i) => `<div class="pf"><span style="font-size:18px">📄</span><div style="min-width:0"><div class="nm">${esc(f.split("/").pop())}</div><div class="sz">workspace</div></div><button class="x" data-rw="${i}">✕</button></div>`).join("") +
    (S.project ? `<div class="pf"><span style="font-size:18px">▤</span><div style="min-width:0"><div class="nm">${esc(S.projects.find((x) => x.id === S.project)?.name || S.project)}</div><div class="sz">proyek</div></div><button class="x" data-rj>✕</button></div>` : "") +
    [...S.skillsOn].map((s) => `<div class="pf"><span style="font-size:18px">🧰</span><div style="min-width:0"><div class="nm">${esc(s.split(":")[1])}</div><div class="sz">skill</div></div><button class="x" data-rs="${esc(s)}">✕</button></div>`).join("");
  box.style.display = box.innerHTML ? "" : "none";
  $$("[data-rp]", box).forEach((b) => (b.onclick = () => { S.pending.splice(+b.dataset.rp, 1); renderPending(); }));
  $$("[data-rw]", box).forEach((b) => (b.onclick = () => { S.wsFiles.splice(+b.dataset.rw, 1); renderPending(); }));
  $("[data-rj]", box) && ($("[data-rj]", box).onclick = () => { S.project = null; S.projectTouched = true; renderPending(); });
  $$("[data-rs]", box).forEach((b) => (b.onclick = () => { S.skillsOn.delete(b.dataset.rs); LS.set("skills", [...S.skillsOn]); renderPending(); }));
  updateSend();
}
$("#fileIn").onchange = (e) => { uploadFiles([...e.target.files]); e.target.value = ""; };
document.addEventListener("paste", (e) => {

function composerHtml(big) {
  return `<div class="composer">

        <span class="sp"></span>
        <button class="cb plain" id="modelBtn" title="Pilih model"></button>

}
function bindComposer() {
  const ta = $("#prompt");
  ta.value = S.draft || "";

  ta.onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !isMobile()) { e.preventDefault(); send(); }
    if (e.key === "ArrowUp" && !ta.value && S.cur?.messages?.length) {
      const lastU = [...S.cur.messages].map((m, i) => [m, i]).filter(([m]) => m.role === "user").pop();
      if (lastU && !S.cur.readonly) { e.preventDefault(); editMessage(lastU[1]); }
    }
  };
  $("#sendBtn").onclick = () => (S.live && S.live.sid === (S.cur?.id || null) ? stop() : send());
  $("#plusBtn").onclick = (e) => openPlusMenu(e.currentTarget);
  $("#modelBtn").onclick = (e) => openModelPicker(e.currentTarget);
  $("#permBtn").onclick = (e) => openPermMenu(e.currentTarget);
  $("#thinkBtn").onclick = () => { S.think = !S.think; LS.set("think", S.think); renderComposerBar(); };
  renderComposerBar(); renderPending();
}
function autoGrow() { const ta = $("#prompt"); if (!ta) return; ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, innerHeight * 0.42) + "px"; }
function renderComposerBar() {
  const p = prov(S.provider);
  const mb = $("#modelBtn");
  if (!mb) return;
  mb.innerHTML = `${p && !p.ready ? "○ " : ""}${esc(modelLabel(currentModel()) || "Pilih model")} <span class="badge g-${p?.group || "api"} hide-m">${esc(p?.group === "langganan" ? "Langganan" : provShort(S.provider))}</span> ▾`;
  $("#thinkBtn").classList.toggle("on", S.think);
  $("#thinkBtn").style.display = p?.kind === "openai" ? "none" : "";
  const pb = $("#permBtn");
  pb.style.display = S.mode === "code" && p?.kind === "claude-sdk" ? "" : "none";
  pb.innerHTML = `${PERM[S.perm].ic}<span class="hide-m">${PERM[S.perm].n}</span>`;
  pb.classList.toggle("on", S.perm === "otomatis");
  updateSend();
}
function updateSend() {
  const b = $("#sendBtn");
  if (!b) return;
  const live = S.live && S.live.sid === (S.cur?.id || null);
  b.classList.toggle("stop", Boolean(live));
  b.textContent = live ? "■" : "↑";
  b.title = live ? "Hentikan (Esc)" : "Kirim (Enter)";
  const has = ($("#prompt")?.value.trim() || S.pending.length) && !S.pending.some((x) => x.uploading);

function stepHtml(s, live) {
  if (s.kind === "perm") return "";
  const running = live && s.result === undefined && !s.done;
  const nm = esc(s.label || s.name).replace(/^(\w+)\(/, "<b>$1</b>(");
  let body = "";
  const inp = s.input || {};
  if ((s.name === "Edit" || s.name === "MultiEdit") && (inp.old !== undefined || inp.edits)) {
    const pairs = inp.edits || [{ old: inp.old, new: inp.new }];
    body += `<div class="diff"><div class="h">${esc(inp.file || "")}</div>${pairs.map((p) => (p.old || "").split("\n").map((l) => `<div class="d">- ${esc(l)}</div>`).join("") + (p.new || "").split("\n").map((l) => `<div class="a">+ ${esc(l)}</div>`).join("")).join('<div class="h">⋯</div>')}</div>`;
  } else if (s.name === "Write" && inp.content !== undefined) {
    body += `<div class="diff"><div class="h">${esc(inp.file || "")} (berkas baru/ditimpa)</div>${inp.content.split("\n").slice(0, 80).map((l) => `<div class="a">+ ${esc(l)}</div>`).join("")}</div>`;
  } else if (s.name === "TodoWrite" && inp.todos) {
    body += `<div class="todo">${inp.todos.map((t) => `${t.status === "completed" ? "☑" : t.status === "in_progress" ? "◐" : "☐"} ${esc(t.content)}`).join("<br>")}</div>`;
  } else if (s.name === "Bash" && inp.command) {
    body += `<div class="out">$ ${esc(inp.command)}</div>`;
  }
  if (s.result) body += `<div class="out">${esc(s.result)}</div>`;
  const auto = (s.name === "Edit" || s.name === "Write" || s.name === "MultiEdit" || s.name === "TodoWrite") && !s.error;
  return `<details class="step ${running ? "run" : ""} ${s.error ? "bad" : ""}" ${auto && live ? "open" : ""}><summary><span class="b">⏺</span><span class="l">${s.sub ? "↳ " : ""}${nm}</span></summary>${body}</details>`;
}
function msgHtml(m, i, live) {
  if (m.role === "user") {
    const atts = (m.attachments || []).map((a) => /\.(png|jpe?g|gif|webp)$/i.test(a.file) ? `<a href="/api/lampiran?file=${encodeURIComponent(a.file)}" target="_blank"><img class="thumb" src="/api/lampiran?file=${encodeURIComponent(a.file)}" alt="${esc(a.name)}" loading="lazy"></a>` : `<a class="chipf" href="/api/lampiran?file=${encodeURIComponent(a.file)}" target="_blank">📎 <span>${esc(a.name)}</span></a>`).join("") + (m.files || []).map((f) => `<span class="chipf">📄 <span>${esc(f)}</span></span>`).join("") + (m.docs || []).map((d) => `<span class="chipf">📎 <span>${esc(d.name)}</span></span>`).join("");
    return `<div class="msg user" data-i="${i}"><div style="display:flex;flex-direction:column;align-items:flex-end;max-width:min(85%,640px)">${m.text ? `<div class="bubble">${esc(m.text)}</div>` : ""}${atts ? `<div class="att-row">${atts}</div>` : ""}</div>${S.cur?.readonly || live ? "" : `<div class="acts"><button data-act="copy">Salin</button><button data-act="edit">✎ Edit</button></div>`}</div>`;
  }
  const p = prov(m.provider);
  const thinking = m.thinking ? `<details class="think" ${live && !m.text ? "open" : ""}><summary>${live && !m.text ? "Sedang berpikir…" : "Proses berpikir"}</summary><div class="tx">${esc(m.thinking)}</div></details>` : "";
  const steps = (m.steps || []).filter((s) => s.kind === "tool");
  const stepsHtml = steps.length ? `<div class="steps">${steps.length > 8 && !live ? `<details class="step"><summary><span class="b">⏺</span><span class="l">${steps.length} langkah — tampilkan</span></summary>${steps.map((s) => stepHtml(s)).join("")}</details>` : steps.map((s) => stepHtml(s, live)).join("")}</div>` : "";
  const perms = live ? (m.perms || []).map(permHtml).join("") : "";
  const notes = (m.notes || []).map((n) => `<div style="font-size:13px;color:var(--faint)">${esc(n)}</div>`).join("");
  const meta = [
    p ? `<span class="badge g-${p.group}">${esc(provShort(p.id))}</span>` : m.provider === "kantor" ? `<span class="badge">Kantor PGA</span>` : m.provider === "claude.ai" ? `<span class="badge g-langganan">claude.ai</span>` : "",
    m.model ? esc(modelLabel(m.model)) : "",
    m.meta?.routedVia ? `via ${esc(m.meta.routedVia)}` : m.meta?.servedModel && m.meta.servedModel !== m.model && !/^claude/.test(m.meta.servedModel) ? `via ${esc(m.meta.servedModel)}` : "",
    m.ms ? `${(m.ms / 1000).toFixed(1)} dtk` : "",
    m.meta?.usd ? `≈$${m.meta.usd.toFixed(3)}` : "",
  ].filter(Boolean).join(" · ");
  const isLast = i === S.cur?.messages.length - 1;
  const acts = live ? "" : `<div class="acts"><button data-act="copy">Salin</button>${!S.cur?.readonly && isLast ? `<button data-act="retry">↻ Ulangi</button>` : ""}<span class="meta">${meta}</span></div>`;
  const content = m.text ? `<div class="md ${live ? "caret" : ""}">${md(m.text)}</div>` : live && !m.thinking && !steps.length ? `<div class="md caret" style="color:var(--faint)">${m.waitText || ""}</div>` : "";
  return `<div class="msg ai ${m.error ? "err" : ""}" data-i="${i}">${thinking}${stepsHtml}${perms}${notes}${content}${acts}</div>`;
}
function permHtml(pm) {
  if (pm.answered !== undefined) return `<div class="perm done">${pm.answered ? "✅ Diizinkan" : "⛔ Ditolak"}: <code>${esc(pm.label)}</code></div>`;
  const inp = pm.input || {};
  let detail = "";
  if (pm.name === "Bash") detail = `<div class="out" style="font:12.5px var(--mono);white-space:pre-wrap;margin:6px 0;padding:8px 10px;background:var(--side);border-radius:8px">$ ${esc(inp.command)}</div>${inp.description ? `<div style="font-size:13px;color:var(--faint)">${esc(inp.description)}</div>` : ""}`;
  else detail = stepHtml({ ...pm, kind: "tool" }, true).replace("<details", "<details open");
  const what = { Bash: "menjalankan perintah", Edit: "mengubah berkas", MultiEdit: "mengubah berkas", Write: "menulis berkas", NotebookEdit: "mengubah notebook", Agent: "menjalankan sub-agent" }[pm.name] || `memakai ${pm.name}`;
  return `<div class="perm" data-perm="${pm.id}"><div class="q">Claude ingin ${what}. Izinkan?</div>${detail}<div class="row"><button class="btn" data-pa="1">Izinkan</button><button class="btn2" data-pa="always">Selalu izinkan ${esc(pm.name)} di chat ini</button><button class="btn2" data-pa="0">Tolak</button></div></div>`;
}
function bindMsgActions() {
  $$("#mlist [data-act]").forEach((b) => (b.onclick = () => {
    const i = +b.closest(".msg").dataset.i, m = S.cur.messages[i];
    if (b.dataset.act === "copy") navigator.clipboard?.writeText(m.text).then(() => toast("Tersalin."));
    if (b.dataset.act === "edit") editMessage(i);
    if (b.dataset.act === "retry") retry();
  }));
  $$("#mlist [data-pa]").forEach((b) => (b.onclick = async () => {
    const id = b.closest("[data-perm]").dataset.perm;
    const v = b.dataset.pa;
    await api(`/api/permission/${id}`, { method: "POST", body: { allow: v !== "0", always: v === "always" } }).catch((e) => toast(e.message));
  }));
}
function editMessage(i) {
  const m = S.cur.messages[i];
  S.editAt = i;
  S.draft = m.text;
  S.pending = (m.attachments || []).map((a) => ({ ...a, preview: /\.(png|jpe?g|gif|webp)$/i.test(a.file) ? `/api/lampiran?file=${encodeURIComponent(a.file)}` : null }));
  S.wsFiles = [...(m.files || [])];
  render();
  const ta = $("#prompt"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  toast("Ubah pesan lalu kirim — jawaban setelahnya akan diganti.");

function retry() {
  const msgs = S.cur.messages;
  let i = msgs.length - 1;
  while (i >= 0 && msgs[i].role !== "user") i--;
  if (i < 0) return;
  const m = msgs[i];
  send({ text: m.text, attachments: m.attachments || [], files: m.files || [], truncateAt: i });
}

let raf = 0;
function renderLive() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    if (!S.live || !S.cur || S.live.sid !== S.cur.id) return;
    const box = $("#msgs");
    if (!box) return render();
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
    const holder = $("#mlist .msg[data-i='-1']");
    const html = msgHtml(S.live.msg, -1, true);
    if (holder) {
      // Pertahankan detail yang sedang dibuka pengguna.
      const openIdx = $$("details", holder).map((d, k) => (d.open ? k : -1)).filter((k) => k >= 0);
      holder.outerHTML = html;
      const nh = $("#mlist .msg[data-i='-1']");
      $$("details", nh).forEach((d, k) => { if (openIdx.includes(k)) d.open = true; });

async function openSession(source, id) {

    } else if (source === "claude") setMode("code", true);

async function continueSession() {

function setMode(m, quiet) {

  renderComposerBar();
}

async function send(override) {
  if (S.live) return toast("Tunggu jawaban sebelumnya selesai, atau hentikan dulu.");
  const text = override ? override.text : ($("#prompt")?.value || "").trim();
  const attachments = override ? override.attachments : S.pending.filter((a) => !a.uploading).map(({ name, file, size, type }) => ({ name, file, size, type }));
  const files = override ? override.files : [...S.wsFiles];
  if (!text && !attachments.length) return;
  if (!S.cur) newChat();
  const c = S.cur;
  if (c.readonly) return;
  const p = prov(S.provider);
  if (!p?.ready) { toast(`${p?.name || S.provider} belum siap — atur dulu di Pengaturan.`); return openSettings("model"); }
  const truncateAt = override ? override.truncateAt : S.editAt;
  if (Number.isInteger(truncateAt)) c.messages = c.messages.slice(0, truncateAt);
  c.messages.push({ role: "user", text, attachments, files });
  const body = { sessionId: c.id, provider: S.provider, model: currentModel(), text, attachments, files, skills: [...S.skillsOn], mode: S.mode, perm: S.perm, think: S.think, truncateAt, ...(S.projectTouched || !c.id ? { project: S.project } : {}) };
  S.projectTouched = false;
  S.live = { sid: c.id, msg: { role: "assistant", text: "", thinking: "", provider: S.provider, model: body.model, steps: [], perms: [], notes: [], meta: {}, waitText: "" }, ac: new AbortController() };
  S.pending = []; S.wsFiles = []; S.draft = ""; S.editAt = undefined;
  render();
  const live = S.live;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal: live.ac.signal });
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, k); buf = buf.slice(k + 2);
        if (!chunk.startsWith("data: ")) continue;
        handleEvent(c, live, JSON.parse(chunk.slice(6)));
      }
    }
  } catch (e) {
    if (S.live === live) c.messages.push({ role: "assistant", text: live.ac.signal.aborted ? (live.msg.text || "") + "\n\n_(dihentikan)_" : `⚠️ ${e.message}`, error: !live.ac.signal.aborted, provider: live.msg.provider, model: live.msg.model, steps: live.msg.steps, thinking: live.msg.thinking });
  }
  if (S.live === live) S.live = null;
  S.busyIds.delete(c.id);
  if (S.cur === c) render();
  loadSessions();
  if (S.mode === "code") { S.tabs.forEach((t) => reloadFile(t.path, true)); S.tree = {}; drawTree(); }
}
function handleEvent(c, live, e) {
  const m = live.msg;
  switch (e.type) {
    case "session":
      c.id = e.id; c.title = e.title; live.sid = e.id; S.busyIds.add(e.id);
      if (S.cur === c) { $("#title").textContent = e.title; $("#title").style.visibility = ""; $("#menuBtn").style.visibility = ""; }
      if (!S.sessions.find((s) => s.id === e.id)) { S.sessions.unshift({ source: "studio", id: e.id, title: e.title, updatedAt: Date.now(), mode: S.mode }); renderList(); }
      break;
    case "delta": m.text += e.text; break;
    case "thinking": m.thinking += e.text; break;
    case "tool": m.steps.push({ kind: "tool", id: e.id, name: e.name, label: e.label, input: e.input, sub: e.sub }); if (/^(Write|Edit|MultiEdit)$/.test(e.name)) setTimeout(() => S.tabs.forEach((t) => reloadFile(t.path, true)), 600); break;
    case "tool_result": { const s = m.steps.find((x) => x.id === e.id); if (s) Object.assign(s, { result: e.text || "", error: e.error }); break; }
    case "permission": m.perms.push({ id: e.id, name: e.name, label: e.label, input: e.input }); notify("Claude meminta izin", e.label); break;
    case "permission_done": { const pm = m.perms.find((x) => x.id === e.id); if (pm) pm.answered = e.allow; break; }
    case "info": Object.assign(m.meta, e); break;
    case "note": m.notes.push(e.text); break;
    case "done": case "error":
      c.messages.push(e.message); if (e.title) c.title = e.title;
      if (S.live === live) S.live = null;
      if (document.hidden) notify("Jawaban siap", c.title);
      break;
  }
  if (S.cur === c && S.live === live) renderLive();
}
function stop() {
  const l = S.live;
  if (!l) return;
  if (l.sid) fetch(`/api/chat/${l.sid}/stop`, { method: "POST" }).catch(() => {});
  l.ac.abort();
}
function notify(title, body) {
  if (!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification(title, { body, icon: "/icon.svg" }); } catch {}
}

function openSearch() {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="box" style="max-width:640px"><div class="mh"><input id="sq" placeholder="Cari di semua chat…" style="flex:1;border:0;background:none;outline:none;font-size:17px" autocomplete="off"><button class="ib" data-x>✕</button></div><div class="pane" id="sres" style="padding:8px"></div></div>`;
  document.body.append(m);
  const close = () => m.remove();
  m.onclick = (e) => { if (e.target === m || e.target.closest("[data-x]")) close(); };
  const q = $("#sq", m), res = $("#sres", m);
  let t = 0, sel = 0, items = [];
  const draw = async () => {
    const v = q.value.trim().toLowerCase();
    let found = [];
    if (v.length >= 2) {
      const r = await api(`/api/search?q=${encodeURIComponent(v)}`).catch(() => ({ results: [] }));
      found = r.results;
      const ids = new Set(found.map((x) => x.id));
      found.push(...S.sessions.filter((s) => s.source !== "studio" && !ids.has(s.id) && String(s.title).toLowerCase().includes(v)).slice(0, 30));
    } else found = S.sessions.slice(0, 12);
    items = found; sel = 0;
    res.innerHTML = found.map((s, i) => `<button class="res ${i === 0 ? "kb" : ""}" data-i="${i}">${SRC[s.source].ic || (s.mode === "code" ? "‹›" : "💬")} ${esc(s.title)}<small>${s.snippet ? esc(s.snippet) : `${SRC[s.source].name} · ${ago(s.updatedAt)}`}</small></button>`).join("") || `<div style="padding:20px;text-align:center;color:var(--faint)">Tidak ditemukan.</div>`;
    $$(".res", res).forEach((b) => (b.onclick = () => { const s = items[+b.dataset.i]; close(); openSession(s.source, s.id); }));
  };
  q.oninput = () => { clearTimeout(t); t = setTimeout(draw, 180); };
  q.onkeydown = (e) => {
    const bs = $$(".res", res);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, Math.min(bs.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1))); bs.forEach((b, i) => b.classList.toggle("kb", i === sel)); bs[sel]?.scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter" && items[sel]) { close(); openSession(items[sel].source, items[sel].id); }
    if (e.key === "Escape") close();
  };
  draw(); q.focus();
}
$("#searchBtn").onclick = () => { if (isMobile()) sideMobile(false); openSearch(); };

/* ═════════════ wizard awal ═════════════ */
function openWizard() {
  $(".modal")?.remove();
  const steps = [["akun", "Hubungkan Claude"], ["gratis", "AI gratis"], ["impor", "Impor dari claude.ai"], ["simpan", "Simpan chat"]];
  let i = 0;
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="box" style="max-width:720px"><div class="mh"><h2>Selamat datang di Studio 👋</h2><button class="ib" data-skip>Lewati</button></div>
    <div style="display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap" id="wzSteps"></div><div class="pane" id="wzPane"></div>
    <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)"><button class="btn2" id="wzBack">← Kembali</button><span style="flex:1"></span><button class="btn2" id="wzLater">Nanti saja</button><button class="btn" id="wzNext">Lanjut →</button></div></div>`;
  document.body.append(m);
  const finish = async () => { m.remove(); await api("/api/settings/onboarded", { method: "POST" }).catch(() => {}); S.info.onboarded = true; renderComposerBar(); $("#prompt")?.focus(); };
  const show = () => {
    $("#wzSteps", m).innerHTML = steps.map(([, n], k) => `<span class="badge ${k === i ? "g-langganan" : ""}" style="padding:2px 10px">${k + 1}. ${n}</span>`).join("");
    PANES[steps[i][0]]($("#wzPane", m), true);
    $("#wzBack", m).style.visibility = i ? "" : "hidden";
    $("#wzNext", m).textContent = i === steps.length - 1 ? "Selesai ✓" : "Lanjut →";
    $("#wzLater", m).style.display = i === steps.length - 1 ? "none" : "";
  };
  $("#wzBack", m).onclick = () => { i = Math.max(0, i - 1); show(); };
  $("#wzNext", m).onclick = () => (i === steps.length - 1 ? finish() : (i++, show()));
  $("#wzLater", m).onclick = () => { i++; show(); };
  $("[data-skip]", m).onclick = finish;
  show();
}

async function loadDir(d) {
  try { S.tree[d] = (await api(`/api/files?dir=${encodeURIComponent(d)}`)).entries; } catch (e) { S.tree[d] = []; }
}
async function drawTree() {
  $("#wsName").textContent = S.info?.workspaceName || "";
  for (const d of S.open) if (!S.tree[d]) await loadDir(d);
  const rows = [];
  const walk = (dir, depth) => {
    for (const e of S.tree[dir] || []) {
      const open = S.open.has(e.path);
      rows.push(`<div class="tn ${S.active === e.path ? "on" : ""}" data-p="${esc(e.path)}" data-dir="${e.dir ? 1 : ""}" style="padding-left:${6 + depth * 12}px" title="${esc(e.path)}${e.dir ? "" : " — klik kanan untuk menyertakan ke pesan"}">${e.dir ? (open ? "▾ 📂" : "▸ 📁") : "　" + ficon(e.name)} ${esc(e.name)}</div>`);
      if (e.dir && open) walk(e.path, depth + 1);
    }
  };
  walk("", 0);
  $("#tree").innerHTML = rows.join("");
  $$("#tree .tn").forEach((n) => {
    n.onclick = async () => {
      const p = n.dataset.p;
      if (n.dataset.dir) { S.open.has(p) ? S.open.delete(p) : S.open.add(p); LS.set("openDirs", [...S.open]); drawTree(); }
      else openFile(p);
    };
    n.oncontextmenu = (e) => { if (!n.dataset.dir) { e.preventDefault(); addWsFile(n.dataset.p); toast(`${n.dataset.p} disertakan ke pesan berikutnya.`); } };
  });
}
const ficon = (n) => ({ md: "📝", js: "🟨", mjs: "🟨", json: "🔧", html: "🌐", css: "🎨", sh: "⌨️", py: "🐍", csv: "📊", svg: "🖼️" })[n.split(".").pop().toLowerCase()] || "📄";
async function openFile(p) {
  let t = S.tabs.find((x) => x.path === p);
  if (!t) {
    try { const r = await api(`/api/file?path=${encodeURIComponent(p)}`); t = { path: r.path, content: r.content, saved: r.content, mtime: r.mtime }; S.tabs.push(t); }
    catch (e) { return toast(e.message); }
  }
  S.active = t.path; drawEditor(); drawTree();
}
function drawEditor() {
  const ed = $("#ed");
  const t = S.tabs.find((x) => x.path === S.active);
  if (!S.tabs.length) { ed.innerHTML = `<div class="edempty">Pilih berkas di kiri untuk dibuka.<br>Perubahan yang dibuat Claude muncul otomatis di sini.</div>`; return; }
  ed.innerHTML = `<div class="etabs">${S.tabs.map((x) => `<div class="etab ${x.path === S.active ? "on" : ""}" data-p="${esc(x.path)}">${esc(x.path.split("/").pop())}${x.content !== x.saved ? '<span class="m"></span>' : ""}<button class="x" data-x>✕</button></div>`).join("")}</div>
    <div class="ebar"><span>${esc(t.path)}</span><span class="sp"></span><button class="ib" id="eAsk" title="Tanyakan berkas ini ke AI">✨ Tanya</button><button class="ib" id="eRe" title="Muat ulang">↻</button><button class="btn2" id="eSave" ${t.content === t.saved ? "disabled" : ""}>Simpan</button></div>
    <div class="code"><div class="gut" id="gut"></div><textarea id="codeTa" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>`;
  const ta = $("#codeTa", ed);
  ta.value = t.content;
  const gut = () => { const n = ta.value.split("\n").length; $("#gut", ed).textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n"); $("#gut", ed).scrollTop = ta.scrollTop; };
  gut();
  ta.oninput = () => { const was = t.content === t.saved; t.content = ta.value; gut(); if (was !== (t.content === t.saved)) { $("#eSave", ed).disabled = t.content === t.saved; $$(".etab", ed).find((x) => x.dataset.p === t.path)?.insertAdjacentHTML("beforeend", ""); } };
  ta.onscroll = () => ($("#gut", ed).scrollTop = ta.scrollTop);
  ta.onkeydown = (e) => { if (e.key === "Tab") { e.preventDefault(); ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end"); ta.oninput(); } };
  $$(".etab", ed).forEach((x) => (x.onclick = (e) => { if (e.target.closest("[data-x]")) return closeTab(x.dataset.p); S.active = x.dataset.p; drawEditor(); drawTree(); }));
  $("#eSave", ed).onclick = () => saveFile();
  $("#eRe", ed).onclick = () => reloadFile(t.path);
  $("#eAsk", ed).onclick = () => { addWsFile(t.path); if (isMobile()) openWs(false); $("#prompt")?.focus(); };
}
async function saveFile(force = false) {
  const t = S.tabs.find((x) => x.path === S.active);
  if (!t) return;
  try { const r = await api("/api/file", { method: "PUT", body: { path: t.path, content: t.content, mtime: t.mtime, force } }); t.saved = t.content; t.mtime = r.mtime; drawEditor(); toast(`Tersimpan: ${t.path}`); }
  catch (e) { if (e.status === 409 && confirm(e.message + "\n\nOK = timpa dengan isi editor.")) return saveFile(true); toast(e.message); }
}
async function reloadFile(p, quiet) {
  const t = S.tabs.find((x) => x.path === p);
  if (!t) return;
  if (!quiet && t.content !== t.saved && !confirm("Buang perubahan yang belum disimpan?")) return;
  try {
    const r = await api(`/api/file?path=${encodeURIComponent(p)}`);
    if (quiet && (t.content !== t.saved || r.content === t.saved)) return;
    Object.assign(t, { content: r.content, saved: r.content, mtime: r.mtime });
    if ($("#app").classList.contains("wsopen")) drawEditor();
  } catch {}
}
function closeTab(p) {
  const t = S.tabs.find((x) => x.path === p);
  if (t && t.content !== t.saved && !confirm(`${p} belum disimpan. Tutup?`)) return;
  S.tabs = S.tabs.filter((x) => x.path !== p);
  if (S.active === p) S.active = S.tabs.at(-1)?.path || null;
  drawEditor(); drawTree();
}

/* ═════════════ tata letak & pintasan ═════════════ */
function sideMobile(on) { $("#app").classList.toggle("mside", on); }
$("#sideOpen").onclick = () => (isMobile() ? sideMobile(true) : ($("#app").classList.remove("noside"), LS.set("side", true)));
$("#sideClose").onclick = () => (isMobile() ? sideMobile(false) : ($("#app").classList.add("noside"), LS.set("side", false)));
$("#scrim").onclick = () => sideMobile(false);
$("#newBtn").onclick = () => newChat();
$$("#modeSeg button").forEach((b) => (b.onclick = () => { if (S.cur?.messages?.length && S.cur.mode !== b.dataset.mode && S.cur.source === "studio") { setMode(b.dataset.mode, true); newChat(); } else setMode(b.dataset.mode); }));
function syncSideBtn() { $("#sideOpen").style.display = isMobile() || $("#app").classList.contains("noside") ? "" : "none"; }
new MutationObserver(syncSideBtn).observe($("#app"), { attributes: true, attributeFilter: ["class"] });
addEventListener("resize", syncSideBtn);
addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === "k") { e.preventDefault(); openSearch(); }
  else if (mod && e.shiftKey && k === "o") { e.preventDefault(); newChat(); }
  else if (mod && k === "b") { e.preventDefault(); $("#app").classList.toggle("noside"); }
  else if (mod && k === "s") { e.preventDefault(); saveFile(); }
  else if (e.key === "Escape") { if ($("#pop")) closePop(); else if ($(".modal")) $(".modal").remove(); else if (S.live) stop(); }
  else if (e.key === "/" && !/input|textarea/i.test(document.activeElement?.tagName)) { e.preventDefault(); $("#prompt")?.focus(); }
});
addEventListener("beforeunload", (e) => { if (S.tabs.some((t) => t.content !== t.saved) || S.live) { e.preventDefault(); e.returnValue = ""; } });

(async function init() {
  applyTheme();
  if (!LS.get("side", true) && !isMobile()) $("#app").classList.add("noside");
  syncSideBtn();
  try { S.info = await api("/api/info"); }
  catch (e) { $("#convo").innerHTML = `<div class="hello"><h1>Server Studio tidak terjangkau</h1><p>Jalankan <code>npm run studio</code> lalu muat ulang. (${esc(e.message)})</p></div>`; return; }
  S.providers = S.info.providers; S.skills = S.info.skills; S.sync = S.info.sync; S.profile = S.info.profile || { name: "Rahula" }; S.projects = S.info.projects || [];
  if (!prov(S.provider) || !prov(S.provider).ready) { S.provider = "langganan"; S.model = ""; }
  renderMe(); renderSync();
  setMode(S.mode, true);
  newChat();
  loadSessions();
  setInterval(() => { if (!S.live && document.visibilityState === "visible") loadSessions(); }, 30000);
  if (!S.info.onboarded) openWizard();
  refreshAccount();
})();
</script>
