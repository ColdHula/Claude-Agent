<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HvM AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20498f"/>
      <stop offset=".6" stop-color="#162a5e"/>
      <stop offset="1" stop-color="#241546"/>
    </linearGradient>
    <linearGradient id="mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4e2ff"/>
    </linearGradient>
    <radialGradient id="node" cx="42%" cy="38%" r="68%">
      <stop offset="0" stop-color="#ffd3a6"/>
      <stop offset=".45" stop-color="#ff8f9e"/>
      <stop offset="1" stop-color="#6f8dff"/>
    </radialGradient>
    <radialGradient id="warm" cx="85%" cy="12%" r="55%">
      <stop offset="0" stop-color="#ff9a76" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff9a76" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#warm)"/>
  <rect x="7" y="7" width="498" height="498" rx="114" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
  <!-- H pillars = stabil & terpercaya -->
  <g fill="url(#mk)">
    <rect x="152" y="150" width="42" height="212" rx="20"/>
    <rect x="318" y="150" width="42" height="212" rx="20"/>
    <rect x="152" y="235" width="208" height="42" rx="20"/>
  </g>
  <!-- node AI hangat = karakter indie -->
  <circle cx="256" cy="256" r="40" fill="#162a5e"/>
  <circle cx="256" cy="256" r="27" fill="url(#node)" filter="url(#soft)"/>
</svg>
