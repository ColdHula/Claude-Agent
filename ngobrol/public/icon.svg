<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nexa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1430"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset=".5" stop-color="#7a7bff"/>
      <stop offset="1" stop-color="#36e0c8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#neon)" stroke-opacity=".35" stroke-width="4"/>
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- chat bubble / circuit "N" -->
    <path d="M168 336 V176 L344 336 V176"/>
    <!-- circuit nodes -->
    <circle cx="168" cy="176" r="15" fill="url(#neon)" stroke="none"/>
    <circle cx="344" cy="336" r="15" fill="url(#neon)" stroke="none"/>
    <!-- side traces -->
    <path d="M168 256 H112" /><circle cx="100" cy="256" r="11" fill="url(#neon)" stroke="none"/>
    <path d="M344 256 H400" /><circle cx="412" cy="256" r="11" fill="url(#neon)" stroke="none"/>
  </g>
  <!-- spark -->
  <circle cx="256" cy="256" r="10" fill="#36e0c8" filter="url(#glow)"/>
</svg>
